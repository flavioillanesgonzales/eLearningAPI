name: Hola Munso

on: [push , pull_request]

jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
 
      - name: ls
        run: ls -al

                    
      - name: Setup Java JDK              
        uses: actions/setup-java@v4.4.0
        with:
          distribution: temurin



      - name: java version
        run: java --version



  ls:
    runs-on: ubuntu-latest
    needs: hola
    steps:
      - name: ls
        run: ls -al
  